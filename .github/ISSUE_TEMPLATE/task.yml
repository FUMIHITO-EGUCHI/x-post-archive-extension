name: Task
description: AI 向けタスク packet（feature / refactor / 小粒実装）
title: "[task] "
body:
  - type: markdown
    attributes:
      value: |
        AI（Claude / Codex）が着手できる粒度のタスクを記述してください。
        完了判定は人間が行います。

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: このタスクで達成したいこと（1〜3 行）
      placeholder: 例) viewer の日付フィルタに「今週」ショートカットを追加
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / Files in scope
      description: 触る想定のファイル・モジュール
      placeholder: |
        - src/features/viewer/filters/DateRange.tsx
        - src/features/viewer/filters/types.ts
    validations:
      required: false

  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: 作業項目。AI が進捗に合わせてチェックを更新する
      value: |
        - [ ]
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 完了と認めるための条件
      placeholder: |
        - `npm run typecheck` / `npm run build` が通る
        - viewer から目視で動作確認
    validations:
      required: true

  - type: textarea
    id: human-evidence
    attributes:
      label: Evidence of acceptance（人間が確認する手順）
      description: コードを読まずに確認できる手順を書く。実行結果は必要に応じて共有する。
      placeholder: |
        1. npm run dev で起動
        2. viewer を開き日付フィルタで「今週」を選択
        3. 当該週の投稿のみ表示されることを確認
        4. ページリロードで設定が保持されていることを確認
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / Links
      description: 関連 Issue、Gist（findings）、参照リンク
    validations:
      required: false
