name: ci

on:
  push:
    branches: [master]
    # ドキュメントのみの変更では CI を回さない。コードと CI 設定は除外しない。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'samples/**'
      - 'ai-handoff/**'
      - 'tasks/**'
      - 'templates/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'samples/**'
      - 'ai-handoff/**'
      - 'tasks/**'
      - 'templates/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lint (eslint, content-safe boundary)
        run: npm run lint
      - name: typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: test (vitest)
        run: npm test
      - name: build + content-script bundle guard
        # `npm run guard:content-scripts` runs `wxt build` then verifies the
        # built content scripts do not contain Dexie / DexieError / U+FFFF.
        run: npm run guard:content-scripts
